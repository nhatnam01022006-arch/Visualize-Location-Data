<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/2/atlas.min.css" type="text/css">

    <script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/2/atlas.min.js"></script>
    <script src="config.js"></script>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        #myMap {
            width: 100%;
            height: 100%;
        }
    </style>

    <script>
        // Azure Maps subscription key
        const subscriptionKey = window.AZURE_MAPS_SUBSCRIPTION_KEY;

        // Load GPS data from Backend API
        async function loadGPS() {
            const response = await fetch('/api/gps-data');

            if (!response.ok) {
                throw new Error(
                    `GPS API failed: HTTP ${response.status}`
                );
            }

            const geojson = await response.json();

            if (!Array.isArray(geojson.features)) {
                throw new Error("Invalid GeoJSON response");
            }

            console.log(
                "GPS points loaded:",
                geojson.features.length
            );

            return geojson.features.map(feature =>
                new atlas.data.Feature(
                    new atlas.data.Point(
                        feature.geometry.coordinates
                    ),
                    feature.properties || {}
                )
            );
        }

        // Initialize Azure Maps
        async function init() {
            try {
                const features = await loadGPS();

                const map = new atlas.Map("myMap", {
                    center: [
                        13.394116666666667,
                        52.517266666666664
                    ],
                    zoom: 12,

                    authOptions: {
                        authType: "subscriptionKey",
                        subscriptionKey: subscriptionKey
                    }
                });

                map.events.add("ready", function () {
                    const source = new atlas.source.DataSource();

                    map.sources.add(source);

                    map.layers.add(
                        new atlas.layer.BubbleLayer(source)
                    );

                    source.add(features);

                    console.log(
                        "Map ready. GPS markers displayed:",
                        features.length
                    );
                });

            } catch (error) {
                console.error("Application error:", error);

                alert(
                    "Cannot load GPS data. Check browser Console."
                );
            }
        }
    </script>
</head>

<body onload="init()">
    <div id="myMap"></div>
</body>

</html>
